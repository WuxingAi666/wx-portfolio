name: Application checks
on:
  push:
  pull_request:
jobs:
  boundaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s tests -v
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check frontend/js/assistant.js
      - run: node --check frontend/js/projects.js
      - run: node --check frontend/js/main.js
      - run: node --check frontend/js/resume.js
      - run: node --check frontend/js/assistant-config.js
      - run: python scripts/sync-project-content.py --check
      - run: python scripts/sync-knowledge.py --check
      - run: python -m compileall -q backend/app scripts
