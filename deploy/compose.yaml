# API port is deliberately not published; only Caddy can reach it.
# Run from deploy/: docker compose --env-file .env up -d --build
services:
  api:
    build: ../backend
    restart: unless-stopped
    env_file: ../backend/.env
    environment:
      ENVIRONMENT: production
      ALLOWED_HOSTS: '["${API_DOMAIN:?Set API_DOMAIN in deploy/.env}","localhost","127.0.0.1","api"]'
      ALLOWED_ORIGINS: '["${SITE_ORIGIN:-https://wuxingai666.github.io}"]'
      PUBLIC_SITE_URL: "${PUBLIC_SITE_URL:-https://wuxingai666.github.io/wx-portfolio/}"
      STORAGE_DIR: /app/storage
    volumes:
      - rag-storage:/app/storage
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [api]
    environment:
      API_DOMAIN: "${API_DOMAIN:?Set API_DOMAIN}"
      ACME_EMAIL: "${ACME_EMAIL:?Set ACME_EMAIL}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  rag-storage:
  caddy-data:
  caddy-config:
