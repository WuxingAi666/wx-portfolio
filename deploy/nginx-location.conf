# Insert inside your existing HTTPS server block for the API domain.
# TLS certificates / server_name are managed by your existing reverse proxy.
location / {
    client_max_body_size 24k;
    proxy_pass http://127.0.0.1:8010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite visitor-supplied proxy headers, rather than appending them.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 90s;
    proxy_send_timeout 30s;
}
