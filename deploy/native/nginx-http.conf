# Current HTTP site, served directly without redirecting to the retired domain.
server {
    listen 80;
    listen [::]:80;
    server_name 8.152.192.126;
    include /etc/nginx/snippets/wx-portfolio-locations.conf;
}

# Keep previously shared links usable while publishing the direct IP entry.
server {
    listen 80;
    listen [::]:80;
    server_name cloud.8-152-192-126.sslip.io;
    return 308 http://8.152.192.126$request_uri;
}
