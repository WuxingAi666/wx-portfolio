# Shared by HTTP bootstrap and the final HTTPS virtual host.
root /var/www/wx-portfolio;
index index.html;
client_max_body_size 24k;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

location = / { return 302 /wx/; }
location = /wx { return 308 /wx/; }
location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    try_files $uri =404;
}
location /wx/api/ {
    # Strip only the mount prefix. FastAPI routes start at /api/.
    proxy_pass http://127.0.0.1:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Nginx is the only public proxy; discard untrusted incoming forwarding headers.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 100s;
    proxy_send_timeout 100s;
}
location = /wx/kanban { return 308 https://8.152.192.126/wx/kanban/; }
location = /wx-kanban { return 308 https://8.152.192.126/wx/kanban/; }
location = /wx-kanban/ { return 308 https://8.152.192.126/wx/kanban/; }
location = /wx/看板/ { return 308 https://8.152.192.126/wx/kanban/; }
location /wx/kanban/ {
    if ($scheme = http) { return 308 https://8.152.192.126$request_uri; }
    proxy_pass http://127.0.0.1:3001/kanban/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
}
location /wx/admin/ {
    if ($scheme = http) { return 308 https://8.152.192.126$request_uri; }
    proxy_pass http://127.0.0.1:3001/admin/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
}
location /wx/health/ {
    proxy_pass http://127.0.0.1:3001/health/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location ~ /\. { deny all; }
location /wx/ {
    # Only frontend/ is linked below this root; backend and envs cannot be served.
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
location / { return 404; }
