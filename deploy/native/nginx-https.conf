# Install after issuing the short-lived Let's Encrypt IP certificate.
# Website HTTP stays available; dashboard HTTP redirects to HTTPS.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 8.152.192.126;
    ssl_certificate /etc/letsencrypt/live/wx-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wx-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:WX_TLS:10m;
    include /etc/nginx/snippets/wx-portfolio-locations.conf;
}
