server {
    listen 80;
    listen [::]:80;
    server_name llywjr.love;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name llywjr.love;
    ssl_certificate /etc/letsencrypt/live/llywjr.love/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/llywjr.love/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:WXSSL:10m;
    ssl_session_timeout 1d;
    include /etc/nginx/snippets/wx-portfolio-locations.conf;
}
